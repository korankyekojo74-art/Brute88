<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE88 | NODE INITIALIZATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #ff3c00; --dark: #070707; }
        body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { width: 100%; max-width: 450px; background: var(--dark); border: 1px solid #1a1a1a; padding: 40px; box-sizing: border-box; }
        h2 { font-family: 'Cinzel', serif; color: var(--gold); text-align: center; letter-spacing: 4px; }
        label { display: block; font-size: 0.6rem; color: #555; text-transform: uppercase; margin-bottom: 8px; margin-top: 15px; }
        input, textarea, select { width: 100%; background: #000; border: 1px solid #222; padding: 12px; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--gold); }
        .submit-btn { width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; font-family: 'Cinzel', serif; font-weight: 900; cursor: pointer; letter-spacing: 2px; margin-top: 25px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>NODE REGISTRY</h2>
    <form action="https://formspree.io/f/mpqyooqz" method="POST">
        <label>Node ID (Username)</label>
        <input type="text" name="username" placeholder="ALPHA_NODE" required>

        <label>Bio / Personal Manifesto</label>
        <textarea name="bio" rows="2" placeholder="State your mission..."></textarea>

        <label>Access Tier</label>
        <select name="tier">
            <option value="free">FREE NODE (Social Only)</option>
            <option value="initiate">INITIATE ($1)</option>
            <option value="architect">ARCHITECT ($2)</option>
            <option value="co-creator">CO-CREATOR ($3)</option>
            <option value="propagator">PROPAGATOR ($4)</option>
            <option value="sovereign">SOVEREIGN ($5)</option>
        </select>

        <label>Verification (CashApp Tag or TxID)</label>
        <input type="text" name="payment_ref" placeholder="Enter 'FREE' or Transaction Code">

        <button type="submit" class="submit-btn">INITIALIZE NODE</button>
    </form>
</div>

</body>
</html>
