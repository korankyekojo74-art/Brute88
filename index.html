<!-- COMMIT 74 QUANTUM TOGGLE - SAFE ISOLATED -->
<style>
#quantum-isolated{border:1px solid rgba(0,255,136,.3);border-radius:12px;padding:12px;margin-top:10px;background:#0a0a0a}
#quantum-isolated button{background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700}
#quantum-isolated #quantum-output{margin-top:8px;background:#111;border:1px solid #222;border-radius:8px;padding:8px;font-size:12px;white-space:pre-wrap}
</style>
<div id="quantum-isolated">
  <div style="color:#00ff88;font-weight:700">QUANTUM SECTOR - Commit 74</div>
  <button id="quantum-toggle" onclick="toggleQuantum()">[ OFF ] Activate Bell Simulator</button>
  <div id="quantum-output">System idle.</div>
</div>
<script>
(function(){
  let quantumActive=false;
  window.toggleQuantum=function(){
    const b=document.getElementById('quantum-toggle');
    const o=document.getElementById('quantum-output');
    quantumActive=!quantumActive;
    if(quantumActive){
      b.textContent='[ ON ] Deactivate'; b.style.background='#ff4444';
      o.textContent='> [0.707,0,0,0.707] Bell (|00>+|11>)/sqrt2\n> Probs [0.5,0,0,0.5] ENTANGLED';
    }else{
      b.textContent='[ OFF ] Activate Bell Simulator'; b.style.background='#00ff88';
      o.textContent='System idle.';
    }
  };
})();
</script>
