<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE88 | Premium Strength</title>
    <style>
        :root {
            --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .lion-logo {
            font-size: 100px;
            margin-bottom: 10px;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(184, 134, 11, 0.6));
            animation: pulse 3s infinite ease-in-out;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        p {
            color: #888;
            letter-spacing: 3px;
            font-size: 0.9rem;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .cta-button {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #bf953f;
            color: #bf953f;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .cta-button:hover {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lion-logo">🦁</div>
        <h1>BRUTE88</h1>
        <p>Strength • Power • Luxury</p>
        <a href="#" class="cta-button">JOIN THE PRIDE</a>
    </div>
</body>
</html>
