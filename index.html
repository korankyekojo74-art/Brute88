<html lang="en">
<head>

<title>brute88.com</title>
<style>
  body{margin:0;background:#050505;color:#eaeaea;font-family:monospace;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
  .card{background:#0e0e0e;border:1px solid #2a2a2a;border-radius:18px;padding:18px;margin:18px 0}
  .top{display:flex;align-items:center;gap:14px}
  .avatar{width:56px;height:56px;border-radius:50%;border:2px solid #d4b000;background:#1a1a1a;flex-shrink:0}
  .name{font-size:22px;font-weight:700;letter-spacing:0.5px}
  .time{color:#666;font-size:14px;margin-top:2px}
  .msg{font-size:19px;line-height:1.35;margin:18px 0 16px;color:#e6e6e6}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:1px solid #d4b000;color:#d4b000;background:transparent;border-radius:8px;padding:8px 14px;font-family:monospace;font-size:15px;letter-spacing:1px}
  .btn-active{background:#0f0f0f}
  a.btn-link{text-decoration:none}
  .fund{border:1.5px solid #00ff88;border-radius:2px;padding:16px;margin-top:32px}
  .fund-title{color:#00ff88;letter-spacing:2px;font-size:16px;margin-bottom:10px}
  .fund-sub{color:#c8ffcc;font-size:16px;line-height:1.3;margin-bottom:16px}
  .drop{width:100%;background:#00ff88;color:#000;border:0;border-radius:2px;padding:16px 10px;font-weight:800;letter-spacing:1px;font-size:16px;font-family:monospace}
  .addr-row{display:flex;gap:8px;margin-top:14px}
  .addr{flex:1;background:#111;border:1px solid #333;color:#aaa;padding:10px 10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .copy{border:1px solid #00ff88;color:#00ff88;background:transparent;padding:10px 16px;font-family:monospace}
</style>
</head>
<body>
