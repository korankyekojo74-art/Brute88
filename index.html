<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE88 | Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --obsidian: #000; }
        body { 
            background: var(--obsidian); color: #fff; margin: 0; 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            font-family: 'Montserrat', sans-serif; overflow: hidden;
        }

        /* GLASS PORTAL FRAME */
        .login-box {
            width: 85%; max-width: 380px; padding: 60px 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(5, 5, 5, 0.95);
            box-shadow: 0 0 60px rgba(0, 0, 0, 1);
            text-align: center; position: relative;
        }
        
        .portal-header { 
            font-family: 'Cinzel', serif; color: var(--gold); 
            letter-spacing: 6px; margin-bottom: 40px; font-size: 1.1rem;
        }

        /* ENCRYPTED INPUTS */
        input {
            width: 100%; padding: 18px; margin-bottom: 25px;
            background: transparent; border: none; border-bottom: 1px solid #222; 
            color: var(--gold); font-family: monospace; outline: none; 
            box-sizing: border-box; text-align: center; transition: 0.4s;
            font-size: 1rem;
        }
        input:focus { border-bottom: 1px solid var(--gold); color: #fff; }

        /* AUTHORIZE BUTTON */
        .access-btn {
            width: 80%; margin-top: 20px; padding: 15px; background: transparent;
            border: 1px solid var(--gold); color: var(--gold);
            font-weight: bold; letter-spacing: 6px; cursor: pointer;
            transition: 0.5s; font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }
        .access-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

        .hint { margin-top: 50px; font-size: 0.6rem; color: #222; letter-spacing: 5px; font-weight: 900; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="portal-header">IDENTITY VERIFICATION</div>
        
        <input type="text" placeholder="NODE_ID" spellcheck="false" autocomplete="off">
        <input type="password" placeholder="KEY_CODE" autocomplete="off">
        
        <button class="access-btn" onclick="window.location.href='manifesto.html'">AUTHORIZE</button>
        
        <div class="hint">III • VI • IX</div>
    </div>

</body>
</html>
