<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE88 | The Torus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Montserrat:wght@300;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --ember: #ff3c00; --obsidian: #000; }
        body { background: var(--obsidian); color: #fff; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; text-align: center; overflow: hidden; transition: background 0.1s; height: 100vh; width: 100vw; }

        /* ROMAN NUMERAL BACKGROUND */
        .bg-numerals {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 15vw; font-weight: 900; color: rgba(212, 175, 55, 0.03);
            z-index: 1; pointer-events: none; font-family: 'Cinzel', serif;
        }

        /* THE TORUS ENGINE */
        .stage { height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: center; align-items: center; perspective: 1000px; position: relative; z-index: 10; }
        
        .torus-wrap { position: relative; width: 220px; height: 220px; transform-style: preserve-3d; animation: rotateTorus 6s linear infinite; margin-bottom: 20px; }
        .ember-core { position: absolute; width: 45px; height: 45px; background: var(--ember); border-radius: 50%; box-shadow: 0 0 50px var(--ember), 0 0 100px var(--ember); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: breathe 3s infinite; }
        
        .ring { position: absolute; width: 100%; height: 100%; border: 1.5px solid var(--gold); border-radius: 50%; opacity: 0.4; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .r1 { transform: rotateY(0deg); } .r2 { transform: rotateY(45deg); } .r3 { transform: rotateY(90deg); } .r4 { transform: rotateY(135deg); }

        /* BRUTE88 BRANDING - IDENTICAL TO BUILD 1 */
        .branded-logo { 
            font-size: 3.2rem; letter-spacing: 15px; font-weight: 900; font-family: 'Cinzel', serif; 
            background: linear-gradient(to bottom, #f2d381 0%, #D4AF37 50%, #886020 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            margin: 15px 0; cursor: pointer; position: relative; z-index: 25;
        }
        .sub-tagline { font-size: 0.65rem; letter-spacing: 6px; color: #555; text-transform: uppercase; margin-top: 5px; font-weight: 300; }

        .tribe-btn { 
            margin-top: 45px; color: var(--gold); text-decoration: none; 
            letter-spacing: 4px; font-size: 0.75rem; border: 1px solid var(--gold); 
            padding: 14px 40px; border-radius: 40px; transition: 0.3s;
            position: relative; z-index: 25;
        }

        /* THE GATEWAY (THE FIX) */
        .access-portal-container {
            margin-top: 80px;
            position: relative;
            z-index: 999; /* ABOVE EVERYTHING */
        }
        .portal-link { 
            color: #111; /* STEALTH MODE */
            text-decoration: none; 
            letter-spacing: 4px; 
            font-size: 0.55rem; 
            padding: 40px; /* HUGE TAP AREA */
            display: inline-block;
        }

        /* ANIMATIONS */
        @keyframes rotateTorus { from { transform: rotateX(0deg) rotateY(0deg); } to { transform: rotateX(360deg) rotateY(360deg); } }
        @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }

        /* HULK CRACK EFFECT */
        .cracked { background-image: url('https://www.transparenttextures.com/patterns/broken-glass.png'); background-color: #0a0a0a !important; }
    </style>
</head>
<body>

    <div class="bg-numerals">
        <span>III</span><span>VI</span><span>IX</span>
    </div>

    <section class="stage">
        <div class="torus-wrap" id="torus">
            <div class="ember-core"></div>
            <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
        </div>

        <h1 class="branded-logo" id="brute-logo">BRUTE88</h1>
        <div class="sub-tagline">STRENGTH • POWER • LUXURY</div>
        
        <a href="#" class="tribe-btn">JOIN THE PRIDE</a>

        <div class="access-portal-container">
            <a href="login.html" class="portal-link">
                ABUNDANCE BY INTENTION // 963741 // [ACCESS PORTAL]
            </a>
        </div>
    </section>

    <script>
        let rotationCount = 0;
        const torus = document.getElementById('torus');
        const logo = document.getElementById('brute-logo');

        // Track 9 rotations for the "Crack"
        setInterval(() => {
            rotationCount++;
            if (rotationCount >= 9) {
                document.body.classList.add('cracked');
            }
        }, 6000);

        // Interaction - Hold to "Power Up"
        logo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            torus.style.animationDuration = "0.6s";
            document.body.style.background = "#080000";
        });
        logo.addEventListener('touchend', () => {
            torus.style.animationDuration = "6s";
            document.body.style.background = "var(--obsidian)";
        });
    </script>
</body>
</html>
