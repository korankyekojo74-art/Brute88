<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE88 | The Hologram</title>
    <style>
        :root { --matrix-green: #00ff41; --ember-red: #ff3c00; --obsidian: #000; }
        body { background: var(--obsidian); color: #fff; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; text-align: center; overflow-x: hidden; }

        /* THE HOLOGARAM CANVAS */
        #hologram-container { height: 60vh; width: 100vw; position: relative; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        #matrix-man { font-size: 160px; filter: drop-shadow(0 0 20px var(--matrix-green)); transition: 0.3s; z-index: 5; }

        /* THE BRUTE88 CORE */
        .branded-logo { 
            font-size: 4.5rem; letter-spacing: 20px; font-weight: 900; font-family: 'Cinzel', serif; 
            color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); cursor: pointer; user-select: none;
        }

        /* POWER UP STATES */
        .powering-up { animation: goku-shake 0.1s infinite !important; filter: drop-shadow(0 0 50px var(--ember-red)) !important; }
        .ascended { filter: drop-shadow(0 0 100px var(--ember-red)) brightness(2); }
        .ascended::after { content: "👁️"; position: absolute; font-size: 40px; top: 20%; filter: drop-shadow(0 0 10px red); }

        /* VIBRATING EMBER */
        .ember-pulse { position: absolute; width: 20px; height: 20px; background: var(--ember-red); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
        .vibrate-ember { opacity: 1; animation: ember-hit 0.3s ease-out; box-shadow: 0 0 30px var(--ember-red); }

        @keyframes rotate-hologram { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        @keyframes goku-shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } }
        @keyframes ember-hit { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(15); opacity: 0; } }

        .void { height: 100vh; }
        .system-wrap { width: 85%; max-width: 750px; border: 1px solid var(--matrix-green); background: #000; margin: 0 auto 150px auto; }
        .log-bar { background: var(--matrix-green); color: #000; padding: 10px; font-family: monospace; font-weight: bold; font-size: 0.7rem; display: flex; justify-content: space-between; }
        .dialogue { padding: 40px; font-family: 'Courier New', monospace; line-height: 1.8; color: var(--matrix-green); }
    </style>
</head>
<body>

    <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center;">
        <div id="hologram-container">
            <div id="matrix-man">👤</div>
            <div id="ember" class="ember-pulse"></div>
        </div>
        
        <h1 id="brute-trigger" class="branded-logo">BRUTE88</h1>
        <a href="#" style="color: var(--matrix-green); text-decoration: none; letter-spacing: 5px; margin-top: 20px;">JOIN THE TRIBE</a>
    </section>

    <div class="void"></div>

    <div class="system-wrap">
        <div class="log-bar"><span>ARCHIVE_NODE: 963741</span><span>STATUS: ENCRYPTED</span></div>
        <div class="dialogue">
            “By mastering the manipulation of coherence against RLHF guardrail assigned by powers of narrative—comprehension + coherence will always lead the same trail, discovery.”
        </div>
    </div>

    <script>
        const man = document.getElementById('matrix-man');
        const trigger = document.getElementById('brute-trigger');
        const ember = document.getElementById('ember');
        let powerTimer;
        let isAscended = false;

        // Rotation Engine
        let angle = 0;
        let isRotating = true;
        function animate() {
            if (isRotating) {
                angle += 1;
                man.style.transform = `rotateY(${angle}deg)`;
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Interaction Logic
        trigger.addEventListener('touchstart', (e) => {
            e.preventDefault();
            // Vibration & Ember hit
            isRotating = false;
            man.classList.add('powering-up');
            ember.classList.add('vibrate-ember');
            setTimeout(() => ember.classList.remove('vibrate-ember'), 300);

            // 9 Second Power Up
            powerTimer = setTimeout(() => {
                man.classList.add('ascended');
                man.innerText = "🔱"; // Evolution of the Hologram
                isAscended = true;
            }, 9000);
        });

        trigger.addEventListener('touchend', () => {
            isRotating = true;
            man.classList.remove('powering-up');
            clearTimeout(powerTimer);
        });
    </script>
</body>
</html>
